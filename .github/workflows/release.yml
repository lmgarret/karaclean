name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.2.3). Leave empty to auto-detect from tags.'
        required: false
        type: string

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
      body: ${{ steps.body.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Find previous tag
        id: prev_tag
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          # Legacy two-component vX.Y tags are not strict semver, which
          # llm-release-action requires for current_version. Create a
          # local-only vX.Y.0 alias at the same commit and pass it as both
          # base_ref and current_version. The alias is never pushed, so it
          # triggers nothing.
          if [[ "$PREV" =~ ^v?[0-9]+\.[0-9]+$ ]]; then
            ALIAS="${PREV}.0"
            git tag -f "$ALIAS" "$PREV"
            PREV="$ALIAS"
          fi
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Generate AI changelog
        id: changelog
        # On tag pushes the version comes from the tag, so an LLM outage only
        # drops the AI changelog. Manual runs need next_version, so they still fail.
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: lmgarret/llm-release-action@d83e2c706b87f8a94a53f3b6d11d8610ace338e3 # v2.2.0
        with:
          model: anthropic/claude-sonnet-5-5
          fast_model: anthropic/claude-haiku-5-5
          base_ref: ${{ steps.prev_tag.outputs.tag }}
          current_version: ${{ steps.prev_tag.outputs.tag }}
          # Self-hosted sidecar: breaking means operators must change their config.
          project_type: service
          changelog_config: |
            default:
              languages: [en]
              tone: professional
              sections: [breaking, features, improvements, fixes]
              benefit_focused: true
              include_infrastructure: false
              summary_only: false
              emojis: true
          context_files: README.md,CLAUDE.md,karaclean.example.yaml
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate commit log
        id: commitlog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          LOG=$(git log --oneline "${PREVIOUS_TAG}..HEAD" 2>/dev/null || git log --oneline)
          {
            echo "log<<COMMITLOG_EOF"
            echo "$LOG"
            echo "COMMITLOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            RAW="${{ inputs.version || steps.changelog.outputs.next_version || 'nightly' }}"
            VERSION="${RAW#v}"
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compose release body
        id: body
        env:
          VERSION: ${{ steps.version.outputs.name }}
          COMMITS: ${{ steps.commitlog.outputs.log }}
          CHANGELOG: ${{ steps.changelog.outputs.changelogs && fromJSON(steps.changelog.outputs.changelogs).default.en || '' }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          {
            echo "body<<BODY_EOF"
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG"
              echo ""
              echo "---"
              echo ""
            fi
            echo "### Docker image"
            echo ""
            echo "Published to \`${IMAGE}\` (multi-arch: linux/amd64, linux/arm64):"
            echo ""
            echo '```'
            echo "${IMAGE}:${VERSION}   # immutable, exact release"
            echo "${IMAGE}:${VERSION%.*} # latest patch on this minor"
            echo "${IMAGE}:${VERSION%%.*} # latest release on this major"
            echo "${IMAGE}:latest        # newest stable release"
            echo '```'
            echo ""
            echo "<details><summary>Full commit log</summary>"
            echo ""
            echo '```'
            echo "$COMMITS"
            echo '```'
            echo "</details>"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

  docker:
    name: Build and push Docker image
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # No-prefix semver ladder. metadata-action auto-suppresses `latest`
          # and the bare major for pre-releases (e.g. v1.2.3-rc1) and major 0.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve-version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve-version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.resolve-version.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.resolve-version.outputs.name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}

  create-release:
    name: Create GitHub Release
    needs: [resolve-version, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create versioned release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: ${{ needs.resolve-version.outputs.tag }}
          body: ${{ needs.resolve-version.outputs.body }}
          generate_release_notes: false
